<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="discGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#34C759" />
      <stop offset="100%" stop-color="#1B803A" />
    </radialGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1F24" />
      <stop offset="100%" stop-color="#0E0F12" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#2C2E38" stroke-width="8" opacity="0.6"/>
  
  <!-- Center Main Disc -->
  <circle cx="256" cy="256" r="156" fill="url(#discGrad)" filter="url(#shadow)" />
  <circle cx="256" cy="256" r="150" fill="none" stroke="#FFFFFF" stroke-width="4" opacity="0.35" />
  
  <!-- Disc 7 Graphic -->
  <text x="256" y="324" font-family="system-ui, -apple-system, Roboto, sans-serif" font-weight="900" font-size="200" fill="#FFFFFF" text-anchor="middle" letter-spacing="-4">7</text>
  
  <!-- Mini surrounding orbit discs symbolizing the 7 numbers -->
  <circle cx="256" cy="68" r="18" fill="#FFD200" />
  <circle cx="410" cy="140" r="18" fill="#FF7A00" />
  <circle cx="440" cy="310" r="18" fill="#FF3B30" />
  <circle cx="340" cy="440" r="18" fill="#AF52DE" />
  <circle cx="172" cy="440" r="18" fill="#007AFF" />
  <circle cx="72" cy="310" r="18" fill="#5AC8FA" />
  <circle cx="102" cy="140" r="18" fill="#57606F" />
</svg>
